<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Agent Tune Kit · 会话轨迹</title>
  <style>__STYLES__</style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <div class="brand-line"><span class="brand">ATK</span><strong>会话轨迹</strong><span id="session-title" class="session-id"></span></div>
    <nav class="tabs" role="tablist" aria-label="会话视图">
      <button id="tab-traces" role="tab" aria-controls="view-traces" data-view="traces">执行轨迹</button>
      <button id="tab-issues" role="tab" aria-controls="view-issues" data-view="issues">异常列表</button>
      <button id="tab-overview" role="tab" aria-controls="view-overview" data-view="overview">会话信息</button>
    </nav>
  </div></header>
  <main class="app-shell">
    <div id="warnings" role="status"></div>
    <section id="view-overview" class="view" role="tabpanel" aria-labelledby="tab-overview" hidden>
      <h1>会话信息</h1><p id="session-source" class="muted"></p><p id="generated" class="muted"></p>
    </section>
    <section id="view-traces" class="view" role="tabpanel" aria-labelledby="tab-traces">
      <div class="view-heading"><div><h1 id="lane-title">完整会话</h1><div id="summary" class="muted"></div></div>
        <div class="view-actions"><label class="capture-choice">快照 <select id="capture-filter"></select></label>
          <details id="issue-picker"><summary>定位异常 <span id="lane-issue-count">0</span></summary><div id="lane-issues" class="picker-menu"></div></details>
        </div>
      </div>
      <div id="capture-status" role="status"></div>
      <section class="panel timeline-panel" aria-labelledby="lane-title">
        <div id="lane-scroll" class="lane-scroll" tabindex="0" aria-label="执行泳道"><div id="lane-chart"></div></div>
        <div class="lane-footer"><div class="lane-legend"><span><i class="legend-track"></i>执行范围</span><span><i class="legend-tick"></i>动作</span><span id="legend-fragment" hidden><i class="legend-fragment"></i>异常片段</span></div>
          <button id="lane-reset" type="button" hidden>← 返回完整会话</button></div>
        <div id="lane-members" hidden></div>
      </section>
      <section id="fragment-bar" aria-label="异常定位" hidden>
        <div class="fragment-title"><strong id="fragment-issue"></strong><span id="fragment-position"></span></div>
        <div class="fragment-controls"><button id="fragment-prev" aria-label="上一片段">←</button><button id="fragment-next" aria-label="下一片段">下一片段 →</button>
          <button id="fragment-fields">片段证据</button><button id="fragment-detail">问题详情</button><button id="fragment-exit">退出定位</button></div>
      </section>
      <section class="record-panel" aria-labelledby="records-title">
        <div class="records-heading"><div class="records-title"><h2 id="records-title">执行记录</h2><span id="trace-count" class="muted" aria-live="polite"></span></div>
          <div class="toolbar record-filters">
            <label id="trace-choice"><span class="sr-only">Trace</span><select id="trace-filter"></select></label>
            <label><span class="sr-only">记录范围</span><select id="record-mode"><option value="">全部记录</option><option value="key">关键动作</option></select></label>
            <label><span class="sr-only">类型</span><select id="type-filter"></select></label>
            <label class="search-label"><span class="sr-only">搜索记录</span><input id="trace-search" type="search" placeholder="搜索动作或输入输出"></label>
          </div>
        </div>
        <div class="panel stream"><div class="row-grid stream-header"><span>会话时间</span><span class="trace-col">Trace</span><span>动作</span><span class="result-col">结果 / 耗时</span></div>
          <div id="trace-scroll" tabindex="0" aria-label="执行记录，按时间顺序"><div id="trace-list"></div></div>
        </div>
      </section>
    </section>
    <section id="view-issues" class="view" role="tabpanel" aria-labelledby="tab-issues" hidden><h1>异常列表</h1>
      <div class="toolbar"><label class="search-label">搜索 <input id="issue-search" type="search" placeholder="搜索问题、现象或证据"></label><label>状态 <select id="issue-status"></select></label></div>
      <div id="issue-list" class="issue-grid"></div><div class="pagination"><span id="issue-count" aria-live="polite"></span><button id="issue-prev">上一页</button><span id="issue-page"></span><button id="issue-next">下一页</button></div>
    </section>
  </main>
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden tabindex="-1"><div class="drawer-header"><h2 id="drawer-title"></h2><button id="drawer-close" aria-label="关闭详情">关闭 ×</button></div><div id="drawer-content" class="drawer-content"></div></aside>
  <script id="trace-data" type="application/json">__DATA__</script>
  <script>__LANES__</script>
  <script>__APP__</script>
</body>
</html>
