<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Agent Tune Kit · 会话轨迹</title>
  <style>__STYLES__</style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner">
    <div class="brand-line"><span class="brand">ATK</span><a id="dashboard-link" class="back-link" href="../index.html" hidden>← 大盘</a><strong>会话轨迹</strong><span id="session-title" class="session-id"></span></div>
    <div class="topbar-meta"><span id="session-stats" class="muted"></span><button id="session-info" type="button">会话信息 ▸</button></div>
  </div></header>
  <div id="warnings" class="page-warnings" role="status"></div>
  <main class="workspace">
    <aside id="issue-rail" class="issue-rail" aria-label="问题栏">
      <div class="rail-header">
        <div class="rail-title"><strong>问题</strong><span id="rail-count" class="muted"></span></div>
        <button id="rail-toggle" type="button" aria-expanded="true" title="收起问题栏" aria-label="收起问题栏">«</button>
      </div>
      <div class="rail-filters">
        <label class="search-label"><span class="sr-only">搜索问题</span><input id="issue-search" type="search" placeholder="搜索问题"></label>
        <details id="project-choice" class="project-choice"><summary id="project-summary">异常根因项目：全部</summary><div class="project-menu"><p>含子项目</p><button id="project-clear" type="button">清空筛选</button><div id="project-filter" role="group" aria-label="异常根因项目"></div></div></details>
      <label><span class="sr-only">状态</span><select id="issue-status"></select></label>
      </div>
      <div id="issue-rail-list" class="rail-list"></div>
    </aside>
    <div class="main-pane">
      <div class="view-heading">
        <div><h1 id="lane-title">完整会话</h1><div id="summary" class="muted"></div></div>
        <div class="view-actions"><label class="capture-choice">快照 <select id="capture-filter"></select></label></div>
      </div>
      <div id="capture-status" role="status"></div>
      <section class="panel timeline-panel" aria-labelledby="lane-title">
        <div id="lane-scroll" class="lane-scroll" tabindex="0" aria-label="执行泳道"><div id="lane-chart"></div></div>
        <div class="lane-footer">
          <div class="lane-legend">
            <span><i class="legend-track"></i>执行范围</span>
            <span><i class="legend-tick"></i>动作</span>
            <span id="legend-fragment" hidden><i class="legend-fragment"></i>问题片段</span>
          </div>
          <button id="lane-reset" type="button" hidden>← 返回完整会话</button>
        </div>
        <div id="lane-members" hidden></div>
      </section>
      <section id="fragment-bar" aria-label="片段定位" hidden>
        <div class="fragment-title"><strong id="fragment-issue"></strong><span id="fragment-position"></span></div>
        <div class="fragment-controls">
          <button id="fragment-prev" aria-label="上一片段">←</button>
          <button id="fragment-next" aria-label="下一片段">下一片段 →</button>
          <button id="fragment-fields">片段证据</button>
          <button id="fragment-detail">问题详情</button>
          <button id="fragment-exit">取消选中</button>
        </div>
      </section>
      <section class="record-panel" aria-labelledby="records-title">
        <div class="records-heading">
          <div class="records-title"><h2 id="records-title">Event</h2><span id="trace-count" class="muted" aria-live="polite"></span></div>
          <div class="toolbar record-filters">
            <label id="trace-choice"><span class="sr-only">Trace</span><select id="trace-filter"></select></label>
            <label class="segments-only"><input id="segments-only" type="checkbox"> 仅看片段</label>
            <label><span class="sr-only">记录范围</span><select id="record-mode"><option value="">全部记录</option><option value="key">关键动作</option></select></label>
            <label><span class="sr-only">类型</span><select id="type-filter"></select></label>
            <label class="search-label"><span class="sr-only">搜索记录</span><input id="trace-search" type="search" placeholder="搜索动作或输入输出"></label>
          </div>
        </div>
        <div class="panel stream">
          <div class="row-grid stream-header"><span>会话时间</span><span class="trace-col">Trace</span><span>动作</span><span class="result-col">结果 / 耗时</span></div>
          <div id="trace-scroll" tabindex="0" aria-label="执行记录，按时间顺序"><div id="trace-list"></div></div>
        </div>
      </section>
    </div>
  </main>
  <aside id="drawer" class="drawer" role="dialog" aria-modal="false" aria-labelledby="drawer-title" hidden tabindex="-1">
    <div class="drawer-resizer" id="drawer-resizer" aria-hidden="true"></div>
    <div class="drawer-header"><h2 id="drawer-title"></h2><button id="drawer-close" aria-label="关闭详情">关闭 ×</button></div>
    <div id="drawer-content" class="drawer-content"></div>
  </aside>
  <script id="trace-data" type="application/json">__DATA__</script>
  <script>__LANES__</script>
  <script>__MARKDOWN__</script>
  <script>__APP__</script>
</body>
</html>
