<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>__ATK_TITLE__</title>
  <style>
__ATK_STYLES__
  </style>
</head>
<body>
  <div id="application-root" class="app-shell">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand-lockup">
          <div class="brand-icon" aria-hidden="true"></div>
          <div>
            <h1>Dataset Visualizer</h1>
            <div class="dataset-path" id="path-context"></div>
          </div>
        </div>
        <div class="topbar-actions">
          <button type="button" class="btn primary" id="export-reviewed-dataset-btn">导出评测结果</button>
        </div>
      </div>
    </header>

    <main class="workspace">
      <section class="tab-strip" aria-label="Dataset views">
        <div class="tabs">
          <button type="button" class="tab active" id="tab-grid" data-tab="grid">数据列表</button>
          <button type="button" class="tab" id="tab-stats" data-tab="stats">字段特征分析</button>
        </div>
        <div class="standard-column-note">
          <span>当前标准列已定位在:</span>
          <strong id="standard-column">无定位</strong>
        </div>
      </section>

      <section class="view active" id="view-grid" data-view="grid">
        <div id="dataset-table-controller" class="table-controller">
          <div class="control-card">
            <div class="search-wrap">
              <span class="search-icon" aria-hidden="true">⌕</span>
              <input id="search" type="search" placeholder="在整个数据集搜索..." aria-label="搜索全部字段">
            </div>
            <button type="button" class="btn ghost" id="clear-filters-btn">重置所有过滤器</button>
            <span class="filtered-count" id="filtered-count">0 / 0</span>
          </div>

          <div class="field-switcher" id="column-visibility-panel">
            <span class="field-switcher-title">显示数据字段:</span>
            <div id="column-chips" class="column-chips"></div>
          </div>

          <div id="empty-state-all" class="empty-state" hidden>
            <strong>暂无数据行</strong>
            <span>No data rows in dataset.csv</span>
          </div>
          <div id="empty-state-filtered" class="empty-state" hidden>
            <strong>没有匹配的行</strong>
            <span>请调整搜索词或过滤器。</span>
          </div>

          <div class="table-frame">
            <table class="dataset-table" aria-label="数据列表">
              <thead id="table-head"></thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>

          <div class="pager">
            <button id="prev" type="button" class="btn">上一页</button>
            <div class="pager-center">
              <span id="page-label"></span>
              <select id="page-size" aria-label="每页行数"></select>
            </div>
            <button id="next" type="button" class="btn">下一页</button>
          </div>
        </div>
      </section>

      <section class="view" id="view-stats" data-view="stats">
        <div id="statistics-dashboard" class="stats-dashboard">
          <div class="stat-grid">
            <div id="stat-card-rows" class="stat-card">
              <span class="stat-icon"></span>
              <div><span class="stat-label">总记录条数</span><strong id="stat-total">0</strong></div>
            </div>
            <div id="stat-card-fields" class="stat-card">
              <span class="stat-icon"></span>
              <div><span class="stat-label">总字段数</span><strong id="stat-fields">0</strong></div>
            </div>
            <div id="stat-card-gt" class="stat-card">
              <span class="stat-icon"></span>
              <div><span class="stat-label">参考答案覆盖率</span><strong id="stat-gt">N/A</strong></div>
            </div>
          </div>

          <div class="stats-layout">
            <aside class="field-catalog">
              <div class="section-heading">
                <span>数据列特征分析</span>
                <strong id="field-count">0</strong>
              </div>
              <div class="search-wrap compact">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input id="column-search" type="search" placeholder="搜索数据字段名..." aria-label="搜索字段">
              </div>
              <div id="column-list" class="column-list"></div>
            </aside>
            <section class="field-detail">
              <div id="selected-column-detail" class="field-detail-card"></div>
              <div id="length-histogram" class="histogram-card"></div>
            </section>
          </div>
        </div>
      </section>
    </main>

    <div id="inspector-overlay-pane" class="inspector-overlay" hidden>
      <aside class="inspector-panel" role="dialog" aria-modal="true" aria-labelledby="inspector-title">
        <div class="inspector-header">
          <div class="inspector-title-wrap">
            <span id="inspector-row-badge" class="row-badge">#</span>
            <div>
              <h2 id="inspector-title">数据集详情</h2>
              <p id="inspector-subtitle"></p>
            </div>
          </div>
          <button type="button" id="inspector-close" class="icon-btn" aria-label="关闭">×</button>
        </div>
        <div id="inspector-body" class="inspector-body"></div>
      </aside>
    </div>

    <div class="drawer-backdrop" id="drawer-backdrop"></div>
    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <div class="drawer-header">
        <span id="drawer-title">设置</span>
        <button type="button" id="drawer-close" class="btn ghost" aria-label="关闭">×</button>
      </div>
      <div class="drawer-body">
        <section class="drawer-section" data-section="roles">
          <h3>schema-adaptive role switching · 字段角色映射 · auto-detected</h3>
          <div id="drawer-roles"></div>
        </section>
        <section class="drawer-section" data-section="warnings">
          <h3>解析警告</h3>
          <div id="drawer-warnings"></div>
        </section>
      </div>
    </aside>

  </div>

  <!-- audit markers (preserved for plugin self-test substring checks; do not remove) -->
  <div class="audit-only" aria-hidden="true">__ATK_AUDIT_MARKERS__</div>

  <script type="application/json" id="dataset-data">__ATK_DATA_JSON__</script>
  <script>
__ATK_VENDOR_JS__
  </script>
  <script>
__ATK_APP_JS__
  </script>
</body>
</html>
